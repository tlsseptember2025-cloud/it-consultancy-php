name: Deploy to IONOS Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy PHP Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy files to IONOS dev
        run: |
          sshpass -p "${{ secrets.SFTP_PASSWORD }}" rsync -avz --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".env" \
            --exclude="storage/logs/" \
            -e "ssh -p ${{ secrets.SFTP_PORT }} -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_HOST }}:${{ secrets.SFTP_PATH }}