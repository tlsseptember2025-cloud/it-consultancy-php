name: Deploy to IONOS Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy PHP Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp apache2-utils

      - name: Deploy application files to IONOS dev
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" "sftp://$SFTP_HOST:$SFTP_PORT" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 30

          mirror --reverse --delete --verbose \
            --exclude-glob .git \
            --exclude-glob .github \
            --exclude-glob .env \
            --exclude-glob .htaccess \
            --exclude-glob .htpasswd \
            --exclude-glob storage/logs \
            ./ "$SFTP_PATH"

          bye
          EOF

      - name: Create development environment file
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_SSL_CA: ${{ secrets.DB_SSL_CA }}
        run: |
          cat > .env <<EOF
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_NAME=$DB_NAME
          DB_USER=$DB_USER
          DB_PASS=$DB_PASS
          DB_SSL_CA=$DB_SSL_CA
          EOF

      - name: Upload development environment file
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" "sftp://$SFTP_HOST:$SFTP_PORT" <<EOF
          set sftp:auto-confirm yes
          put -O "$SFTP_PATH" .env
          bye
          EOF

      - name: Create development password file
        env:
          DEV_AUTH_USER: ${{ secrets.DEV_AUTH_USER }}
          DEV_AUTH_PASSWORD: ${{ secrets.DEV_AUTH_PASSWORD }}
        run: |
          htpasswd -nb "$DEV_AUTH_USER" "$DEV_AUTH_PASSWORD" > .htpasswd

      - name: Upload development password file
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" "sftp://$SFTP_HOST:$SFTP_PORT" <<EOF
          set sftp:auto-confirm yes
          put -O "$SFTP_PATH" .htpasswd
          bye
          EOF

      - name: Create development password protection file
        run: |
          mkdir -p public

          cat > public/.htaccess <<'EOF'
          AuthType Basic
          AuthName "WAHBIB Development Site"
          AuthUserFile /homepages/16/d4299801455/htdocs/mysite/dev/.htpasswd
          Require valid-user
          EOF

      - name: Upload development password protection file
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" "sftp://$SFTP_HOST:$SFTP_PORT" <<EOF
          set sftp:auto-confirm yes
          put -O "$SFTP_PATH/public" public/.htaccess
          bye
          EOF
