name: Deploy to IONOS Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-demo:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application files to IONOS Demo
        env:
          SFTP_HOST: ${{ secrets.DEMO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.DEMO_SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.DEMO_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.DEMO_SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.DEMO_SFTP_PATH }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 20;
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no';
            open -u $SFTP_USERNAME,$SFTP_PASSWORD sftp://$SFTP_HOST:$SFTP_PORT;
            mirror --reverse --delete --verbose \
              --exclude-glob .git \
              --exclude-glob .github \
              --exclude-glob .env \
              --exclude-glob .htaccess \
              --exclude-glob .htpasswd \
              --exclude-glob storage/logs \
              --exclude-glob app/storage/certs/ca.pem \
              --exclude-glob app/storage/certs/demo-ca.pem \
              ./ \"$SFTP_PATH\";
            bye
          "

      - name: Create Demo environment file
        env:
          SFTP_HOST: ${{ secrets.DEMO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.DEMO_SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.DEMO_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.DEMO_SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.DEMO_SFTP_PATH }}

          DEMO_APP_URL: ${{ secrets.DEMO_APP_URL }}
          DEMO_DB_HOST: ${{ secrets.DEMO_DB_HOST }}
          DEMO_DB_PORT: ${{ secrets.DEMO_DB_PORT }}
          DEMO_DB_NAME: ${{ secrets.DEMO_DB_NAME }}
          DEMO_DB_USER: ${{ secrets.DEMO_DB_USER }}
          DEMO_DB_PASS: ${{ secrets.DEMO_DB_PASS }}
          DEMO_DB_SSL_CA: ${{ secrets.DEMO_DB_SSL_CA }}

          # ----------------------------------------------------------
          # Google Meet
          # ----------------------------------------------------------
          DEMO_GOOGLE_MEET_CLIENT_ID: ${{ secrets.DEMO_GOOGLE_MEET_CLIENT_ID }}
          DEMO_GOOGLE_MEET_CLIENT_SECRET: ${{ secrets.DEMO_GOOGLE_MEET_CLIENT_SECRET }}
          DEMO_GOOGLE_MEET_REDIRECT_URI: ${{ secrets.DEMO_GOOGLE_MEET_REDIRECT_URI }}

          # ----------------------------------------------------------
          # Zoom
          # ----------------------------------------------------------
          DEMO_ZOOM_ACCOUNT_ID: ${{ secrets.DEMO_ZOOM_ACCOUNT_ID }}
          DEMO_ZOOM_CLIENT_ID: ${{ secrets.DEMO_ZOOM_CLIENT_ID }}
          DEMO_ZOOM_CLIENT_SECRET: ${{ secrets.DEMO_ZOOM_CLIENT_SECRET }}
          DEMO_ZOOM_USER_EMAIL: ${{ secrets.DEMO_ZOOM_USER_EMAIL }}

          # ----------------------------------------------------------
          # Stripe Test/Sandbox
          # Reuse the existing Dev/Test API credentials.
          # The Demo webhook signing secret is endpoint-specific.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          DEMO_STRIPE_WEBHOOK_SECRET: ${{ secrets.DEMO_STRIPE_WEBHOOK_SECRET }}

        run: |
          cat > .env <<EOF
          DB_HOST=$DEMO_DB_HOST
          DB_PORT=$DEMO_DB_PORT
          DB_NAME=$DEMO_DB_NAME
          DB_USER=$DEMO_DB_USER
          DB_PASS=$DEMO_DB_PASS
          DB_SSL_CA=app/storage/certs/ca.pem

          # ----------------------------------------------------------
          # Google Meet
          # ----------------------------------------------------------
          GOOGLE_MEET_CLIENT_ID="$DEMO_GOOGLE_MEET_CLIENT_ID"
          GOOGLE_MEET_CLIENT_SECRET="$DEMO_GOOGLE_MEET_CLIENT_SECRET"
          GOOGLE_MEET_REDIRECT_URI="$DEMO_GOOGLE_MEET_REDIRECT_URI"

          # ----------------------------------------------------------
          # Zoom
          # ----------------------------------------------------------
          ZOOM_ACCOUNT_ID="$DEMO_ZOOM_ACCOUNT_ID"
          ZOOM_CLIENT_ID="$DEMO_ZOOM_CLIENT_ID"
          ZOOM_CLIENT_SECRET="$DEMO_ZOOM_CLIENT_SECRET"
          ZOOM_USER_EMAIL="$DEMO_ZOOM_USER_EMAIL"
          APP_URL=$DEMO_APP_URL

          DEMO_APP_URL=$DEMO_APP_URL
          DEMO_DB_HOST=$DEMO_DB_HOST
          DEMO_DB_PORT=$DEMO_DB_PORT
          DEMO_DB_NAME=$DEMO_DB_NAME
          DEMO_DB_USER=$DEMO_DB_USER
          DEMO_DB_PASS=$DEMO_DB_PASS
          DEMO_DB_SSL_CA=app/storage/certs/ca.pem

          # ----------------------------------------------------------
          # Stripe Test/Sandbox
          # ----------------------------------------------------------
          STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY
          STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY
          DEMO_STRIPE_WEBHOOK_SECRET=$DEMO_STRIPE_WEBHOOK_SECRET
          EOF

          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 20;
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no';
            open -u $SFTP_USERNAME,$SFTP_PASSWORD sftp://$SFTP_HOST:$SFTP_PORT;
            put -O \"$SFTP_PATH\" .env;
            bye
          "

          rm -f .env